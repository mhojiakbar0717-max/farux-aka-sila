<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body{
        background-color: #c7c5c5;
      }
        
      
.card {
  background: white;
  border: 0.5px solid #ddd;
  border-radius: 12px;
  padding: 2rem;
  position: relative;
  max-width: 520px;
  margin: 1.5rem auto;
  border-radius: 15px;
     box-shadow:0 8px 20px rgba  (0,217, 255, 0.4);
      text-shadow: (3px 2px 1px);
    
}
.badge {
  position: absolute;
  top: -1px;
  right: 0;
  background: #3B5EC6;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: none;
}
.card h2 {
  font-size: 28px;
  font-weight: 700;
  margin: 1rem 0 0.75rem;
}
.card p {
  font-size: 15px;
  color: #555;
  line-height: 1.6;
}
</style>
</head>
<body>
    <div class="card">
  <div class="badge">In progress</div>
  <h1>Lorem Ipsum</h1>
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Provident odio laboriosam quidem harum obcaecati unde inventore repellendus. Corrupti molestiae, facilis earum consectetur debitis fugiat. Facilis a laudantium odit dicta hic!</p>
</div>
</body>
</html>
