<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Players</title>
  <style>
    body{
      min-height:100vh;
      background:url('bg.jpg') center/cover no-repeat;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:#fff;
      background-image:url(https://octagonleague.com/storage/images/ae455946f848cfd9b5247a4d5ac5f826_b8TL2NFp8YOtsu1BH2yAPnlqEv7d2Pxq5IRbIBPa.png) ;
    }
    .title{
      background:#f2c400;
      color:#111;
      padding:14px 28px;
      border-radius:30px;
      font-size:28px;
      font-weight:800;
      border:4px solid #111;
      margin-bottom:30px;
      box-shadow:0 8px 20px rgba(0,0,0,.4);
      text-shadow: 3px 2px 1px aqua;
    }
    .name{
      background:#f2c400;
      color:#111;
      padding:8px 18px;
      border-radius:8px;
      font-weight:700;
      margin-bottom:20px;
      box-shadow: 10px 10px 15px white;
    }
    .cards{
      display:flex;
      gap:40px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .card{
      width:220px;
      background:rgba(0,0,0,.35);
      padding:12px;
      border-radius:8px;
      text-align:center;
      box-shadow:0 10px 20px rgba(0,0,0,.35);
      box-shadow: 10px 10px 15px white;

    }
    .card img{
      width:100%;
      height:260px;
      object-fit:cover;
      display:block;
      border:3px solid #fff;
      box-shadow: 10px 10px 15px white;

    }
    .card h3{
      margin-top:10px;
      font-size:24px;
      color:#000;
      text-shadow:0 1px 0px #fff;
      background:#f2c400;
      padding:6px 10px;
      border-radius:6px;
      box-shadow: 10px 10px 15px white;

    }
  </style>
</head>
<body>

  <div class="title">BEST PLAYERS IN THE OCTAGON LIGA</div>
  <div class="name">Hojiakbar Mamarayimov</div>

  <div class="cards">
    <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSslAq9C3pLpyC9CKM2CBgO5vJxE3dsPBm3_VnXXh_yGFmBuviBpXvxkhs&s=10" alt="Tayson">
      <h3>Tayson</h3>
    </div>

    <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNUeUJk-6_7uFUEtCKH0xBSEYeKWrBHHTjr5jCh9UJiOk3tLDgup3zNrA&s=10" alt="Saturn">
      <h3>Saturn</h3>
    </div>

    <div class="card">
      <img src="imrasm/tayson.jpg" alt="tayson">
      <h3>UZB Tayson</h3>
    </div>
  </div>
</body>
</html>
